name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vinos-rosh-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vinos_rosh_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vinos_rosh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vinos_rosh_ci?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin-ci@vinosrosh.local
      ADMIN_PASSWORD: CI-only-password-A1-123456
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: CI
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # Synthetic public ID: consent is exercised without accepting/loading trackers.
      NEXT_PUBLIC_GA_ID: G-QA-NO-TRACKING
      PREVIEW_MODE: "true"
      SHOW_DEMO_CATALOG: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PAYMENTS_CULQI_ENABLED: "false"
      PAYMENTS_IZIPAY_ENABLED: "false"
      IZIPAY_MCW_INITIATE_ENABLED: "false"
      PAYMENTS_YAPE_MANUAL_ENABLED: "false"
      PAYMENTS_TRANSFER_MANUAL_ENABLED: "false"
      SMOKE_TEST_DATA: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply committed migrations
        run: npx prisma migrate deploy

      - name: Verify reservation migration on legacy fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/reservation-migration-before.sql prisma/migrations/20261016002500_reserve_before_manual_payment/migration.sql tests/sql/reservation-migration-after.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d vinos_rosh_ci -v ON_ERROR_STOP=1

      - name: Seed initial admin
        run: npm run db:seed

      - name: Verify checkout identity migration on legacy fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/idempotency-migration-before.sql prisma/migrations/20261016154500_checkout_idempotency/migration.sql tests/sql/idempotency-migration-after.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d vinos_rosh_ci -v ON_ERROR_STOP=1

      - name: Verify database connectivity
        run: |
          node -e 'const { PrismaClient } = require("@prisma/client"); const p = new PrismaClient(); p.user.count().then(c => { console.log("users:", c); }).finally(() => p.$disconnect())'

      - name: Verify reconciliation migration on legacy fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/reconciliation-migration-before.sql prisma/migrations/20261016190000_admin_reconciliation/migration.sql tests/sql/reconciliation-migration-after.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d vinos_rosh_ci -v ON_ERROR_STOP=1

      - name: Verify cart import migration on legacy fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/cart-import-migration-before.sql prisma/migrations/20261019223000_guest_cart_import/migration.sql tests/sql/cart-import-migration-after.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d vinos_rosh_ci -v ON_ERROR_STOP=1

      - name: Verify cart commands migration on legacy fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/cart-commands-migration-before.sql prisma/migrations/20261020040500_cart_commands/migration.sql tests/sql/cart-commands-migration-after.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d vinos_rosh_ci -v ON_ERROR_STOP=1

      - name: Verify payment attempt migration on legacy fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/payment-attempt-migration-before.sql prisma/migrations/20261022150000_payment_attempt_preparation/migration.sql tests/sql/payment-attempt-migration-after.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d vinos_rosh_ci -v ON_ERROR_STOP=1

      - name: Tests
        run: npm test

      - name: Verify automatic reservation migration on legacy fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/automatic-reservation-migration-before.sql prisma/migrations/20261022170000_automatic_order_reservation/migration.sql tests/sql/automatic-reservation-migration-after.sql | docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d vinos_rosh_ci -v ON_ERROR_STOP=1

      - name: Verify cart idempotency after PostgreSQL dump and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/verify-cart-restore.mjs

      - name: Verify automatic reservation and attempt after PostgreSQL dump and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/verify-cart-restore.mjs automatic

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare isolated visual fixture and standalone assets
        run: |
          npm run db:seed:smoke
          npm run prepare:standalone

      - name: Prepare browser for visual evidence
        timeout-minutes: 3
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "PLAYWRIGHT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Smoke checks and desktop/mobile screenshots
        run: npm run test:smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-01-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  cart-evidence:
    name: Cart evidence (${{ matrix.project }})
    needs: validate
    if: ${{ always() && github.head_ref == 'fase-2/sprint-02-carrito-lateral' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, small-mobile, tablet]
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download original QA evidence
        uses: actions/download-artifact@v4
        with:
          name: sprint-01-smoke-${{ github.run_id }}
          path: evidence-source
      - name: Export original cart PNGs for visual review
        run: node scripts/qa-cart-evidence.mjs evidence-source ${{ matrix.project }}

  integration-evidence:
    name: Sprint 2 evidence (${{ matrix.project }})
    needs: validate
    if: ${{ always() && (github.head_ref == 'fase-2/sprint-02-revision-integracion' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_STORY: S206
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download original QA evidence
        uses: actions/download-artifact@v4
        with:
          name: sprint-01-smoke-${{ github.run_id }}
          path: evidence-source
      - name: Export original integration PNGs for visual review
        run: node scripts/qa-cart-evidence.mjs evidence-source ${{ matrix.project }}

  registration-evidence:
    name: Registration evidence (${{ matrix.project }})
    needs: validate
    if: ${{ always() && github.head_ref == 'fase-2/correccion-registro-local' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, small-mobile, tablet]
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_STORY: AUTH_LOCAL
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download original QA evidence
        uses: actions/download-artifact@v4
        with:
          name: sprint-01-smoke-${{ github.run_id }}
          path: evidence-source
      - name: Export original registration PNGs for visual review
        run: node scripts/qa-cart-evidence.mjs evidence-source ${{ matrix.project }}
