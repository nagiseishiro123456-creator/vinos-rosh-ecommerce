name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: vinos-rosh-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vinos_rosh_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vinos_rosh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vinos_rosh_ci?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin-ci@vinosrosh.local
      ADMIN_PASSWORD: CI-only-password-A1-123456
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: CI
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PREVIEW_MODE: "true"
      SHOW_DEMO_CATALOG: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PAYMENTS_CULQI_ENABLED: "false"
      PAYMENTS_YAPE_MANUAL_ENABLED: "false"
      PAYMENTS_TRANSFER_MANUAL_ENABLED: "false"
      SMOKE_TEST_DATA: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply committed migrations
        run: npx prisma migrate deploy

      - name: Seed initial admin
        run: npm run db:seed

      - name: Verify database connectivity
        run: |
          node -e 'const { PrismaClient } = require("@prisma/client"); const p = new PrismaClient(); p.user.count().then(c => { console.log("users:", c); }).finally(() => p.$disconnect())'

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare isolated visual fixture and standalone assets
        run: |
          npm run db:seed:smoke
          npm run prepare:standalone

      - name: Install Chromium for visual evidence
        run: npx playwright install --with-deps chromium

      - name: Smoke checks and desktop/mobile screenshots
        run: npm run test:smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-01-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
