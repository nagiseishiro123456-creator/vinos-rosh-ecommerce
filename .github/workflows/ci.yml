name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vinos_rosh_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vinos_rosh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vinos_rosh_ci?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin-ci@vinosrosh.local
      ADMIN_PASSWORD: CI-only-password-A1-123456
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply committed migrations
        run: npx prisma migrate deploy

      - name: Seed initial admin
        run: npm run db:seed

      - name: Verify database connectivity
        run: |
          node -e 'const { PrismaClient } = require("@prisma/client"); const p = new PrismaClient(); p.user.count().then(c => { console.log("users:", c); }).finally(() => p.$disconnect())'

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
