services:
  db:
    image: postgres:16-alpine
    container_name: vinos-rosh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinos_rosh}
      POSTGRES_USER: ${POSTGRES_USER:-vinos_rosh_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-local-password}
    ports:
      - "5432:5432"
    volumes:
      - vinos_rosh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinos_rosh_dev} -d ${POSTGRES_DB:-vinos_rosh}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vinos_rosh_postgres_data:
